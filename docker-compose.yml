services:
  openapi-platform:
    image: ghcr.io/nuoxiantech/openapi-platform:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - app_data:/app/.data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - openapi

  openapi-service:
    image: ghcr.io/nuoxiantech/openapi-service:latest
    restart: unless-stopped
    environment:
      LISTEN_ADDR: ":8080"
      API_SERVICE_TOKEN: "${OPENAPI_SERVICE_TOKEN:?OPENAPI_SERVICE_TOKEN must be set}"
      IP_DATABASE_DIRECTORY: "/app/data/ip"
      SERVICE_CONFIG_FILE: "/app/data/runtime/service-configuration.enc"
    volumes:
      - "./data/ip:/app/data/ip:ro"
      - service_runtime:/app/data/runtime
    expose:
      - "8080"
    networks:
      - openapi

volumes:
  app_data:
    name: openapi-app-data
  service_runtime:
    name: openapi-service-runtime

networks:
  openapi:
    name: openapi-network
