services:
  openapi-platform:
    image: ghcr.io/nuoxiantech/openapi-platform:latest
    restart: unless-stopped
    environment:
      NUXT_AUTH_SECRET: "${NUXT_AUTH_SECRET:?NUXT_AUTH_SECRET must be set}"
      NUXT_API_KEY_SECRET: "${NUXT_API_KEY_SECRET:?NUXT_API_KEY_SECRET must be set}"
      NUXT_HOSTS_CONSOLE: "${NUXT_HOSTS_CONSOLE:?NUXT_HOSTS_CONSOLE must be set}"
      NUXT_HOSTS_GATEWAY: "${NUXT_HOSTS_GATEWAY:?NUXT_HOSTS_GATEWAY must be set}"
      DATABASE_DRIVER: "${DATABASE_DRIVER:-pglite}"
      DATABASE_URL: "${DATABASE_URL:-}"
      NUXT_REDIS_URL: "${NUXT_REDIS_URL:-}"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - app_data:/app/.data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - openapi

volumes:
  app_data:
    name: openapi-app-data

networks:
  openapi:
    external: true
    name: openapi-network
