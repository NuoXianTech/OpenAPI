name: CI

on:
  push:
  pull_request:

jobs:
  lint-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: openapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d openapi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/openapi
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin-e2e-pass
      ADMIN_EMAIL: admin@openapi.test
      SITE_URL: http://127.0.0.1:3000
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 2526
      SMTP_SECURE: "false"
      SMTP_FROM: no-reply@openapi.test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run DB migrations
        run: pnpm run db:migrate

      - name: Run e2e tests
        run: pnpm run test:e2e
