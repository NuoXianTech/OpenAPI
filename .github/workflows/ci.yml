name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod=false

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: openapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d openapi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/openapi
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin-e2e-pass
      ADMIN_EMAIL: admin@openapi.test
      SITE_URL: http://localhost:3000
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 2526
      SMTP_SECURE: "false"
      SMTP_FROM: no-reply@openapi.test
      E2E_STATS_WAIT_TIMEOUT_MS: "180000"
      E2E_STATS_WAIT_INTERVAL_MS: "500"
      NUXT_TEST_HOST: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod=false

      - name: Run DB migrations
        run: pnpm run db:migrate

      - name: Run e2e tests with shared Nuxt server
        shell: bash
        run: |
          set -euo pipefail

          pnpm exec nuxt dev --host localhost --port 3000 > /tmp/nuxt-dev.log 2>&1 &
          DEV_PID=$!

          cleanup() {
            kill "$DEV_PID" >/dev/null 2>&1 || true
            wait "$DEV_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for i in {1..90}; do
            if curl -fsS http://localhost:3000/api/list | grep -q '"code"'; then
              break
            fi
            sleep 1
          done

          if ! curl -fsS http://localhost:3000/api/list | grep -q '"code"'; then
            echo "Nuxt dev server did not become ready"
            tail -n 200 /tmp/nuxt-dev.log || true
            exit 1
          fi

          if ! pnpm run test:e2e:ci; then
            tail -n 200 /tmp/nuxt-dev.log || true
            exit 1
          fi
